<style>
:root{
  color-scheme: light;
  --bg:#f4f4f1; --surface:#ffffff; --surface-2:#f8f8f6; --surface-3:#ecebe7;
  --border:rgba(11,11,11,.10); --border-strong:rgba(11,11,11,.18);
  --text:#0b0b0b; --text-2:#52514e; --muted:#6f6e69;
  --accent:#c8102e; --accent-hover:#a50d26; --accent-soft:rgba(200,16,46,.09); --on-accent:#ffffff;
  --grid:#e1e0d9; --axis:#c3c2b7; --hover:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0ca30c; --good-text:#006300; --good-soft:rgba(12,163,12,.10);
  --warn:#fab219; --warn-text:#8a5a00; --warn-soft:rgba(250,178,25,.18);
  --crit:#d03b3b; --crit-text:#b02a2a; --crit-soft:rgba(208,59,59,.10);
  --st-orc:#898781; --st-fila:#4a3aa7; --st-imp:#2a78d6; --st-pronto:#1baf7a; --st-ent:#0ca30c; --st-canc:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius:12px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#232427; --surface:#2d2e32; --surface-2:#34353a; --surface-3:#3e3f45;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --text:#ffffff; --text-2:#c3c2b7; --muted:#9a9891;
  --accent:#e8323f; --accent-hover:#f25561; --accent-soft:rgba(232,50,63,.16);
  --grid:#3e3f45; --axis:#4d4e55; --hover:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926;
  --good-text:#0ca30c; --good-soft:rgba(12,163,12,.16);
  --warn-text:#fab219; --warn-soft:rgba(250,178,25,.14);
  --crit-text:#e66767; --crit-soft:rgba(208,59,59,.18);
  --st-fila:#9085e9; --st-imp:#3987e5; --st-pronto:#199e70; --st-canc:#e66767;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}
.t1{font-weight:550}
.t2{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 8px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 12px;background:var(--surface);border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;background:#0b0b0b;display:block;flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
.start-card .logo{width:72px;height:72px;border-radius:16px}
.brand strong{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--text-2);text-align:left;font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface-3)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;background:var(--surface-3);padding:1px 7px;border-radius:99px;color:var(--text-2)}
.nav .count.warn{background:var(--warn-soft);color:var(--warn-text)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:8px}
.save{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.35;border:0;background:none;padding:0;text-align:left}
.save .dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:none;background:var(--muted)}
.save.ok .dot{background:var(--good)}
.save.pend .dot{background:var(--warn)}
.save.err .dot{background:var(--crit)}
.save.err{color:var(--crit-text);cursor:pointer}
.save.local .dot{background:var(--warn)}
main{padding:28px 32px 64px;min-width:0}
.wrap{max-width:1180px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{margin:0;font-size:22px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--text-2)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-3)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--crit-text)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.icon{padding:6px}
.btn:focus-visible,.chip:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.in{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
select.in{cursor:pointer}
.in.auto{width:auto}
textarea.in{resize:vertical}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--text-2);font-weight:500;min-width:0}
.f small{font-weight:400;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
.section-t{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin:20px 0 8px}
.suf{position:relative}
.suf .in{padding-right:34px}
.suf span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12.5px;pointer-events:none}
.tempo{display:flex;gap:6px;align-items:center}
.tempo .suf{flex:1}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip:hover{background:var(--surface-3)}
.chip .c{font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.on .c{color:inherit;opacity:.7}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .in{padding-left:32px}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;gap:8px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:15px}
.card-b{padding:14px 16px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--text-2);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:650;margin-top:4px;letter-spacing:-.01em;white-space:nowrap}
.kpi .v.neg{color:var(--crit-text)}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-bottom:16px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.mb{margin-bottom:16px}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover .t1{color:var(--accent)}
.li .r{text-align:right;white-space:nowrap}
.onboard ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--text-2)}
.onboard li.done{color:var(--muted);text-decoration:line-through}
.onboard h2{margin:0;font-size:16px}

/* ---------- tabelas ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:1px solid var(--border-strong);border-bottom:0;font-weight:600}
tr.click{cursor:pointer}
tr.click:hover{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
td.acts{text-align:right;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:550;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.badge .ic{width:13px;height:13px}
.badge .d{width:7px;height:7px;border-radius:50%}
.badge.good{background:var(--good-soft);color:var(--good-text)}
.badge.warn{background:var(--warn-soft);color:var(--warn-text)}
.badge.crit{background:var(--crit-soft);color:var(--crit-text)}
.st-sel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:2px 4px 2px 10px;background:var(--surface)}
.st-sel i{width:8px;height:8px;border-radius:50%;flex:none}
.st-sel select{border:0;background:transparent;padding:2px 2px;cursor:pointer;font-size:13px;outline:none}
/* lista aberta do select: sem isso o tema escuro mostra texto branco em fundo branco */
select option{background-color:var(--surface);color:var(--text)}
.swatch{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--border-strong);display:inline-block;flex:none}
.swatch.sm{width:10px;height:10px}

/* ---------- filamentos ---------- */
.spools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.spool{padding:14px;display:flex;flex-direction:column;gap:12px}
.spool.esg{opacity:.65}
.spool-top{display:flex;gap:12px;align-items:center}
.ring{width:46px;height:46px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface-3) 0);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--border-strong)}
.ring::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--border-strong)}
.spool-stats{display:flex;justify-content:space-between;gap:8px}
.spool-stats small{display:block;color:var(--muted);font-size:11.5px}
.spool-stats strong{font-size:16px}
.spool-stats .right{text-align:right}
.spool-acts{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* ---------- gráficos ---------- */
.chart{width:100%;min-height:220px;position:relative}
.chart svg{display:block;overflow:visible}
.chart .tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--hover)}
.chart .b1{fill:var(--s1);pointer-events:none}
.chart .b2{fill:var(--s2);pointer-events:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.15);min-width:170px}
#tip b{display:block;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
#tip .tr span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
#tip i{width:9px;height:9px;border-radius:2px;display:inline-block}
#tip .sep{border-top:1px solid var(--border);margin:5px 0 3px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar-l{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.hbar-l span:last-child{font-variant-numeric:tabular-nums;color:var(--text-2)}
.hbar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--s2)}
details.tbl summary{cursor:pointer;color:var(--text-2);font-size:13px;padding:6px 0}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--border);margin-bottom:4vh}
.modal.wide{max-width:960px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 14px 20px;border-bottom:1px solid var(--border)}
.modal-h h2{margin:0;font-size:17px}
.modal-b{padding:16px 20px 20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal-f .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.ped-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.ped-grid aside{display:flex;flex-direction:column;gap:12px}
.calc{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px}
.calc-t{font-weight:600;margin-bottom:8px}
.calc .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0;color:var(--text-2);font-size:13px}
.calc .r.tot{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;color:var(--text);font-weight:600;font-size:14px}
.sug{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.sug small{display:block;color:var(--text-2);font-size:12px}
.sug strong{font-size:18px}
.preco .in{font-size:20px;font-weight:650;padding:10px 12px}
.lucro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px;padding:10px 12px;border-radius:8px;background:var(--good-soft);color:var(--good-text)}
.lucro strong{font-size:16px}
.lucro small{width:100%;font-size:12px;opacity:.85}
.lucro.neg{background:var(--crit-soft);color:var(--crit-text)}
.fil-row,.pag-row{display:grid;gap:8px;align-items:center;margin-bottom:8px}
.fil-row{grid-template-columns:minmax(0,1fr) 110px 34px}
.fcombo>.swatch{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none}
.fcombo .fr-q{padding-left:34px}
.pag-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 34px}
.pag-res{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin:2px 0 8px}
.aviso{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border-radius:8px;margin:0 0 8px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.aviso .ic{width:15px;height:15px;margin-top:1px}
.aviso.warn{background:var(--warn-soft);color:var(--warn-text);border-color:transparent}
.pag-res b{color:var(--text)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.catalog-pick{margin-bottom:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.combo{position:relative}
.combo .search{max-width:none}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:320px;overflow-y:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:4px}
.combo-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--text)}
.combo-it.on{background:var(--accent-soft)}
.combo-it .t1{font-size:13.5px}
.combo-vazio{padding:12px;color:var(--muted);font-size:13px}

/* ---------- tela inicial / toasts ---------- */
.start{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.start-card{max-width:540px;width:100%;padding:28px}
.start-card h1{margin:14px 0 6px;font-size:22px}
.start-card p{color:var(--text-2);margin:0 0 10px}
.start-card .btns{display:flex;flex-direction:column;gap:8px;margin:18px 0 8px}
.start-card .btns .btn{padding:11px 14px}
.start-card ol{color:var(--text-2);padding-left:20px;margin:8px 0}
.start-err{background:var(--crit-soft);color:var(--crit-text);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin-top:12px}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:300;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:tin .18s ease-out}
.toast.erro{background:var(--crit);color:#fff}
.toast.acao{max-width:360px}
.toast-acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.toast-acoes button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:6px;padding:4px 10px;font-size:12.5px;cursor:pointer;opacity:.85}
.toast-acoes button:first-child{background:var(--accent);border-color:var(--accent);color:#fff;opacity:1}
.toast-acoes button:hover{opacity:1}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.cfg-prev{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;color:var(--text-2)}

@media (max-width:980px){ .grid-main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){ .ped-grid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--border);gap:8px;min-width:0}
  .brand{padding:0;flex:none}
  .brand>div{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .nav button{padding:8px 10px}
  .nav .count{display:none}
  .side-foot{margin:0;padding:0;flex-direction:row}
  .save .txt,#btnTema{display:none}
  main{padding:18px 16px 64px}
}
@media (max-width:600px){
  .form-grid>*{grid-column:1/-1}
  .form-grid>.c3,.form-grid>.c4{grid-column:span 6}
  .modal-b{padding:14px 16px 18px}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100vh;margin:0}
  .pag-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
  .pag-row .pg-f{grid-column:1/3}
  .kpi .v{font-size:20px}
}
@media print{ .side,.head-actions,.toolbar{display:none} .app{display:block} }
</style>
</head>
<body>

<div class="start" id="start"></div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><strong id="brandName">Chip Lab 3D</strong><small>Gestão de impressões</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="save" id="saveStatus" data-act="cliqueStatus"></button>
      <button class="btn sm ghost" id="btnTema" data-act="tema"></button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" hidden></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   Gestor de Impressões 3D — arquivo único, sem dependências.
   Dados: dados.json na pasta escolhida (ex.: OneDrive) + backups diários.
   ===================================================================== */

const DATA_FILE = 'dados.json';
const LS_LOCAL = 'gestor3d_dados_local', LS_SAFE = 'gestor3d_copia_seguranca', LS_TEMA = 'gestor3d_tema';
const FS_OK = typeof window.showDirectoryPicker === 'function';

const MATERIAIS = ['PLA','PLA Matte','PLA Silk','PLA+','PLA-CF','PETG','PETG-CF','TPU','ABS','ASA','PC','PVA','Outro'];

const $ = (s, r=document) => r.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r2 = v => Math.round(v*100)/100;
const r1 = v => Math.round(v*10)/10;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const pad = n => String(n).padStart(2, '0');
const isoDe = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const hojeISO = () => isoDe(new Date());
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const fmt = v => BRL.format(num(v));
const fmtN = (v, d=0) => num(v).toLocaleString('pt-BR', {maximumFractionDigits:d});
const fmtG = g => { g = num(g); return Math.abs(g) >= 1000 ? fmtN(g/1000, 2) + ' kg' : fmtN(g, 0) + ' g'; };
const fmtData = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '—';
const fmtTempo = min => { min = Math.round(num(min)); const h = Math.floor(min/60), m = min % 60; return h ? `${h}h${m ? pad(m) : ''}` : `${m} min`; };
const diasAte = iso => Math.round((new Date(iso + 'T00:00') - new Date(hojeISO() + 'T00:00')) / 864e5);
const corValida = h => /^#[0-9a-f]{6}$/i.test(h || '') ? h : '#888888';

function novoEstado(){
  return { versao:1, config:{...DEFAULT_CONFIG}, clientes:[], filamentos:[], pedidos:[], gastos:[], produtos:[], seq:{pedido:1}, ignorarCatalogo:[], atualizadoEm:null };

function normalize(d){

  // IDs só com letras/números/_/-, números viram números, datas no formato AAAA-MM-DD e textos viram texto —
  // assim um dados.json adulterado não consegue injetar código nas telas.
  const lista = v => Array.isArray(v) ? v.filter(x => x && typeof x === 'object' && !Array.isArray(x)) : [];
  const id = v => v == null || v === '' ? '' : String(v).replace(/[^\w-]/g, '_').slice(0, 64);
  const txt = v => v == null ? '' : String(v);
  const dt = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')) ? String(v) : '';
  const fils = v => lista(v).map(it => ({ filamentoId: id(it.filamentoId), gramas: num(it.gramas) }));
  s.config = {...DEFAULT_CONFIG};
  const cfg = d.config && typeof d.config === 'object' ? d.config : {};
  for (const k of Object.keys(DEFAULT_CONFIG)) if (k in cfg) s.config[k] = typeof DEFAULT_CONFIG[k] === 'number' ? num(cfg[k]) : txt(cfg[k]);
  s.clientes = lista(d.clientes).map(c => ({ id: id(c.id) || uid(), nome: txt(c.nome), telefone: txt(c.telefone), email: txt(c.email), instagram: txt(c.instagram),
    endereco: txt(c.endereco), documento: txt(c.documento), obs: txt(c.obs), criadoEm: dt(c.criadoEm) }));
  s.filamentos = lista(d.filamentos).map(f => ({ id: id(f.id) || uid(), material: txt(f.material), marca: txt(f.marca), cor: txt(f.cor), corHex: corValida(f.corHex),
    pesoTotal: num(f.pesoTotal), pesoRestante: num(f.pesoRestante), preco: num(f.preco), fornecedor: txt(f.fornecedor), dataCompra: dt(f.dataCompra),
    estoqueMinimo: f.estoqueMinimo === '' || f.estoqueMinimo == null ? '' : num(f.estoqueMinimo), obs: txt(f.obs), ...(f.tara != null ? {tara: num(f.tara)} : {}) }));
  s.pedidos = lista(d.pedidos).map(p => ({ id: id(p.id) || uid(), numero: Math.round(num(p.numero)), clienteId: id(p.clienteId) || null,
    titulo: txt(p.titulo), quantidade: Math.max(1, Math.round(num(p.quantidade)) || 1), dataPedido: dt(p.dataPedido), prazo: dt(p.prazo),
    status: STATUS[p.status] ? p.status : 'fila', dataEntrega: dt(p.dataEntrega), filamentos: fils(p.filamentos),
    minutos: num(p.minutos), minutosTrabalho: num(p.minutosTrabalho), extras: num(p.extras), pintado: !!p.pintado, preco: num(p.preco),
    pagamentos: lista(p.pagamentos).map(x => ({ id: id(x.id) || uid(), data: dt(x.data), valor: num(x.valor), forma: txt(x.forma) })),
    obs: txt(p.obs), produtoId: id(p.produtoId) || null, criadoEm: dt(p.criadoEm), estoqueBaixado: !!p.estoqueBaixado, custo: num(p.custo),
    ...(p.importado ? {importado: true} : {}) }));
  s.gastos = lista(d.gastos).map(g => ({ id: id(g.id) || uid(), data: dt(g.data), categoria: txt(g.categoria), descricao: txt(g.descricao), valor: num(g.valor),
    ...(g.filamentoId ? {filamentoId: id(g.filamentoId)} : {}) }));
  s.produtos = lista(d.produtos).map(x => ({ id: id(x.id) || uid(), nome: txt(x.nome), descricao: txt(x.descricao), filamentos: fils(x.filamentos),
    minutos: num(x.minutos), minutosTrabalho: num(x.minutosTrabalho), extras: num(x.extras), pintado: !!x.pintado, preco: num(x.preco) }));
  s.seq = { pedido: Math.max(num(d.seq && d.seq.pedido) || 1, ...s.pedidos.map(p => p.numero + 1), 1) };
  s.ignorarCatalogo = Array.isArray(d.ignorarCatalogo) ? d.ignorarCatalogo.map(txt) : [];
  s.atualizadoEm = typeof d.atualizadoEm === 'string' ? d.atualizadoEm : null;

}
let S = novoEstado();
const UI = { view:'painel', ped:{q:'', st:'ativos', pag:'todos'}, cli:{q:''}, cat:{q:''}, fil:{q:'', mat:'', esgotados:false}, fin:{periodo:'mes', cat:''} };

const getFil = id => S.filamentos.find(f => f.id === id);
const getCli = id => S.clientes.find(c => c.id === id);
const nomeCli = id => (getCli(id) || {}).nome || '';
const filNome = f => f ? `${f.material} ${f.cor}`.trim() : '(filamento removido)';
const filNomeId = id => id ? filNome(getFil(id)) : 'Filamento genérico';
const precoGrama = f => f && num(f.pesoTotal) > 0 ? num(f.preco) / num(f.pesoTotal) : 0;
const precoGramaId = id => id ? precoGrama(getFil(id)) : num(S.config.precoKgPadrao) / 1000;
const pagoDe = p => soma(p.pagamentos || [], x => x.valor);
const saldoDe = p => p.status === 'cancelado' ? 0 : Math.max(0, r2(num(p.preco) - pagoDe(p)));
const minimoFil = f => f.estoqueMinimo !== undefined && f.estoqueMinimo !== '' ? num(f.estoqueMinimo) : num(S.config.estoqueMinimo);
const filBaixo = f => num(f.pesoRestante) > 0 && num(f.pesoRestante) <= minimoFil(f);
const recebimentos = () => S.pedidos.flatMap(p => (p.pagamentos || []).map(x => ({...x, pedido:p})));
const pedidosAReceber = () => S.pedidos.filter(p => !['orcamento','cancelado'].includes(p.status) && saldoDe(p) > 0);

function statusPag(p){
  if (p.status === 'cancelado') return null;
  const preco = num(p.preco), pago = pagoDe(p);
  if (preco <= 0) return null;
  if (pago >= preco - 0.005) return 'pago';
  if (pago > 0) return 'parcial';
  return p.status === 'orcamento' ? null : 'pendente';
}

/* ---------------- custos ---------------- */
function calcCusto(d){
  const c = S.config;
  const filamento = soma(d.filamentos || [], it => num(it.gramas) * precoGramaId(it.filamentoId));
  const horas = num(d.minutos) / 60;
  const horaFixa = num(c.custoHoraMaquina) > 0;
  const energia = horaFixa ? 0 : horas * num(c.potenciaW) / 1000 * num(c.tarifaKwh);
  const desgaste = horaFixa ? 0 : num(c.vidaUtilHoras) > 0 ? horas * num(c.custoImpressora) / num(c.vidaUtilHoras) : 0;
  const maquina = horaFixa ? horas * num(c.custoHoraMaquina) : energia + desgaste;
  const base = filamento + maquina;
  const falha = base * num(c.taxaFalha) / 100;
  const maoObra = num(d.minutosTrabalho) / 60 * num(c.valorHoraTrabalho);
  const extras = num(d.extras) + (d._produto ? 0 : num(c.custoFixoPedido));
  const total = base + falha + maoObra + extras;
  const comMargem = total * (1 + num(c.margemPadrao) / 100);
  // mesma regra da planilha: pintura = maior valor entre % sobre o preço e o valor mínimo
  const pintura = d.pintado && total > 0 ? Math.max(comMargem * num(c.acrescimoPintura) / 100, num(c.pinturaMinimo)) : 0;
  let sug = Math.max(comMargem + pintura, num(c.precoMinimo));
  const a = num(c.arredondamento);
  sug = a > 0 ? Math.ceil(sug / a - 1e-9) * a : r2(sug);
  return {filamento, energia, desgaste, maquina, horaFixa, falha, maoObra, extras, total, pintura, sugerido: total > 0 ? r2(sug) : 0};
}
function movEstoque(lista, sinal){
  (lista || []).forEach(it => { const f = getFil(it.filamentoId); if (f) f.pesoRestante = r1(num(f.pesoRestante) + sinal * num(it.gramas)); });
}
// grava o pedido e mantém o estoque coerente com o status
function commitPedido(novo){
  const i = S.pedidos.findIndex(p => p.id === novo.id);
  const old = i >= 0 ? S.pedidos[i] : null;
  if (old && old.estoqueBaixado) movEstoque(old.filamentos, +1);
  novo.estoqueBaixado = false;
  if (CONSOME.includes(novo.status)) { movEstoque(novo.filamentos, -1); novo.estoqueBaixado = true; }
  if (novo.status === 'entregue' && !novo.dataEntrega) novo.dataEntrega = hojeISO();
  if (i >= 0) S.pedidos[i] = novo; else S.pedidos.push(novo);
  const g = soma(novo.filamentos, it => getFil(it.filamentoId) ? it.gramas : 0);
  if (novo.estoqueBaixado && !(old && old.estoqueBaixado) && g > 0) toast(`Estoque atualizado: −${fmtG(g)} de filamento.`);
  if (!novo.estoqueBaixado && old && old.estoqueBaixado) toast('Filamento devolvido ao estoque.');
}

const store = { mode:null, dir:null, file:null, lastText:'', saving:false, again:false, timer:null, dirty:false, status:'', erro:'', savedAt:null, handle:null };

// IndexedDB só serve para lembrar a pasta escolhida; nunca deve travar a abertura
const comLimite = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('gestor3d', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { return await comLimite((async () => { const db = await idbOpen(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); })(), 1500); } catch(e){ return null; } }
async function idbSet(k, v){ try { await comLimite((async () => { const db = await idbOpen(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); })(), 1500); } catch(e){} }

/* ---------- OneDrive pela internet (Microsoft Graph, login OAuth com PKCE) ----------
   Só funciona quando a página é aberta por https (ex.: GitHub Pages) e MS.clientId está preenchido. */
// Acesso restrito à pasta do próprio aplicativo (OneDrive/Aplicativos/Chip Lab 3D):
// o sistema não enxerga nenhum outro arquivo do OneDrive.
const MS = {

  tenant: 'consumers',     // contas pessoais da Microsoft (hotmail/outlook)
  pasta: 'Aplicativos/Chip Lab 3D', // só para exibição: a pasta é criada pela Microsoft com o nome do registro

const LS_TOK = 'gestor3d_ms_tokens', SS_PKCE = 'gestor3d_ms_pkce', LS_PEND = 'gestor3d_pendente', LS_MODO = 'gestor3d_modo';
const MS_OK = () => !!MS.clientId && location.protocol === 'https:';
const msRedirect = () => location.origin + location.pathname;
const msUrl = (p) => `https://login.microsoftonline.com/${MS.tenant}/oauth2/v2.0/${p}`;
// só a pasta do aplicativo + renovação da sessão (sem acesso a perfil, e-mail ou outros arquivos)
const MS_SCOPE = 'Files.ReadWrite.AppFolder offline_access';
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

async function msLogin(){
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem(SS_PKCE, JSON.stringify({verifier, state, hash: location.hash}));
  location.href = msUrl('authorize') + '?' + new URLSearchParams({
    client_id: MS.clientId, response_type: 'code', redirect_uri: msRedirect(), response_mode: 'query',
    scope: MS_SCOPE, state, code_challenge: challenge, code_challenge_method: 'S256', prompt: 'select_account',
  });
}
function msGuardarTokens(j){
  const antigo = lsGet(LS_TOK) || {};
  lsSet(LS_TOK, { access: j.access_token, refresh: j.refresh_token || antigo.refresh, exp: Date.now() + (j.expires_in || 3600) * 1000 });
}
async function msPostToken(campos){
  const r = await fetch(msUrl('token'), { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams({client_id: MS.clientId, scope: MS_SCOPE, ...campos}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.error || `Falha no login (${r.status})`);
  msGuardarTokens(j);
}
// volta do login da Microsoft: troca o "code" da URL por tokens
async function msRetornoLogin(){
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return false;
  const pk = JSON.parse(sessionStorage.getItem(SS_PKCE) || '{}');
  sessionStorage.removeItem(SS_PKCE);
  history.replaceState(null, '', location.pathname + (pk.hash || ''));
  if (q.has('error')) throw new Error('Login cancelado ou recusado: ' + (q.get('error_description') || q.get('error')));
  if (!pk.verifier || q.get('state') !== pk.state) throw new Error('O login não pôde ser confirmado. Tente entrar de novo.');
  await msPostToken({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: msRedirect(), code_verifier: pk.verifier });
  return true;
}
async function msToken(){
  const t = lsGet(LS_TOK);
  if (t && t.access && Date.now() < t.exp - 60000) return t.access;
  if (t && t.refresh) {
    try { await msPostToken({ grant_type: 'refresh_token', refresh_token: t.refresh }); return lsGet(LS_TOK).access; }
    catch(e) { lsSet(LS_TOK, null); }
  }
  const e = new Error('Sua sessão da Microsoft expirou. Entre de novo.'); e.login = true; throw e;
}
async function graph(caminho, opts = {}){
  const r = await fetch('https://graph.microsoft.com/v1.0' + caminho, { ...opts, cache: 'no-store', headers: { Authorization: 'Bearer ' + await msToken(), ...(opts.headers || {}) } });
  if (r.status === 401) { const t = lsGet(LS_TOK); if (t) { t.exp = 0; lsSet(LS_TOK, t); } }
  return r;
}
const odCaminho = nome => '/me/drive/special/approot:/' + nome.split('/').map(encodeURIComponent).join('/');
async function odLer(nome){
  const r = await graph(odCaminho(nome));
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`OneDrive respondeu ${r.status} ao ler ${nome}`);
  const item = await r.json();
  const d = await fetch(item['@microsoft.graph.downloadUrl'], {cache: 'no-store'});
  if (!d.ok) throw new Error(`Falha ao baixar ${nome} (${d.status})`);

}
async function odGravar(nome, txt){

/* ---------- operações comuns aos dois destinos (pasta local / OneDrive) ---------- */
const REMOTO = () => store.mode === 'pasta' || store.mode === 'onedrive';
const nomeDestino = () => store.mode === 'onedrive' ? `OneDrive: ${MS.pasta}/${DATA_FILE}` : `Pasta: ${store.dir ? store.dir.name : ''}/${DATA_FILE}`;
async function lerDados(){
  if (store.mode === 'onedrive') return (await odLer(DATA_FILE)) || '';
  return await (await store.file.getFile()).text();
}
async function gravarDados(txt){
  if (store.mode === 'onedrive') return odGravar(DATA_FILE, txt);
  const w = await store.file.createWritable(); await w.write(txt); await w.close();
}

function agendarSalvar(){
  S.atualizadoEm = new Date().toISOString();
  try { localStorage.setItem(store.mode === 'local' ? LS_LOCAL : LS_SAFE, JSON.stringify(S)); } catch(e){}
  if (!REMOTO()) { setStatus('local'); return; }
  store.dirty = true; setStatus('pend');
  clearTimeout(store.timer); store.timer = setTimeout(salvarAgora, store.mode === 'onedrive' ? 800 : 400);
}
async function salvarAgora(){
  clearTimeout(store.timer); store.timer = null;
  if (!REMOTO()) return;
  if (store.saving) { store.again = true; return; }
  store.saving = true;
  try {
    const atual = await lerDados();
    if (store.lastText && atual.trim() && atual !== store.lastText) {
      const manter = confirm('O arquivo de dados foi alterado em outro aparelho (ou outra janela) desde que você o abriu.\n\nOK = manter as alterações feitas AQUI (sobrescreve o arquivo)\nCancelar = recarregar os dados do arquivo (descarta a última alteração feita aqui)');
      if (!manter) { S = normalize(JSON.parse(atual)); store.lastText = atual; store.dirty = false; setStatus('ok'); render(); return; }
    }
    const txt = JSON.stringify(S, null, 1);
    await gravarDados(txt);
    store.lastText = txt; store.dirty = false; store.savedAt = new Date(); setStatus('ok');
  } catch(e) {
    console.error(e); setStatus(e.login ? 'login' : 'err', e && e.message || String(e));
  } finally {
    store.saving = false;
    if (store.again) { store.again = false; salvarAgora(); }
  }
}
async function backupDiario(txt){
  if (store.mode === 'onedrive') return backupOneDrive(txt);
  try {
    const bd = await store.dir.getDirectoryHandle('backups', {create:true});
    const nome = `dados-${hojeISO()}.json`;
    try { await bd.getFileHandle(nome); return; } catch(e){}
    const fh = await bd.getFileHandle(nome, {create:true});
    const w = await fh.createWritable(); await w.write(txt); await w.close();
    const nomes = [];
    for await (const [n, h] of bd.entries()) if (h.kind === 'file' && /^dados-\d{4}-\d{2}-\d{2}\.json$/.test(n)) nomes.push(n);
    nomes.sort();
    while (nomes.length > 30) await bd.removeEntry(nomes.shift());
  } catch(e) { console.warn('Backup diário falhou', e); }
}
async function backupOneDrive(txt){
  try {
    const nome = `backups/dados-${hojeISO()}.json`;
    if (await odLer(nome) !== null) return;
    await odGravar(nome, txt);
    const r = await graph(odCaminho('backups') + ':/children?$select=name,id&$top=200');
    if (!r.ok) return;
    const itens = (await r.json()).value.filter(x => /^dados-\d{4}-\d{2}-\d{2}\.json$/.test(x.name)).sort((a, b) => a.name.localeCompare(b.name));
    while (itens.length > 30) await graph('/me/drive/items/' + itens.shift().id, { method: 'DELETE' });
  } catch(e) { console.warn('Backup diário (OneDrive) falhou', e); }
}
// abre os dados da pasta do OneDrive pela internet
async function conectarOneDrive(){
  store.mode = 'onedrive';
  let txt;
  try { txt = await lerDados(); } catch(e) { store.mode = null; throw e; }
  let dados = null;
  if (txt.trim()) {
    try { dados = normalize(JSON.parse(txt)); }
    catch(e) { store.mode = null; throw new Error(`O ${DATA_FILE} do OneDrive não pôde ser lido (corrompido ou incompleto). Restaure um arquivo da pasta "${MS.pasta}/backups".`); }
  } else {
    // primeira vez: a pasta do aplicativo está vazia — oferece trazer o dados.json que já existe
    lsSet(LS_MODO, 'onedrive'); store.lastText = '';
    telaOneDriveVazio();
    return true;
  }
  lsSet(LS_MODO, 'onedrive');
  if (dados) { S = dados; store.lastText = txt; backupDiario(txt); }
  else { S = novoEstado(); store.lastText = ''; await salvarAgora(); }
  // alterações que ficaram pendentes quando a sessão expirou
  const pend = lsGet(LS_PEND);
  if (pend && pend.dados) {
    lsSet(LS_PEND, null);
    if (pend.base === store.lastText || confirm('Havia alterações não salvas de antes do login, mas o arquivo mudou nesse meio tempo.\n\nOK = aplicar as alterações pendentes (sobrescreve)\nCancelar = descartar as pendentes')) {
      S = normalize(pend.dados); store.dirty = true; entrar(); await salvarAgora(); toast('Alterações pendentes salvas no OneDrive.'); return true;
    }
  }
  entrar();
  return true;
}
function telaOneDriveVazio(){

  el.hidden = false; $('#app').hidden = true;
  el.innerHTML = `<div class="card start-card">

async function conectarPasta(h){
  let fh = null, txt = '';
  try { fh = await h.getFileHandle(DATA_FILE); txt = await (await fh.getFile()).text(); }
  catch(e) { if (e.name !== 'NotFoundError') throw e; }
  let dados = null;
  if (fh && txt.trim()) {
    try { dados = normalize(JSON.parse(txt)); }
    catch(e) { throw new Error(`O arquivo ${DATA_FILE} desta pasta não pôde ser lido (está corrompido ou incompleto). Se o OneDrive ainda estiver sincronizando, aguarde e tente de novo; ou restaure um arquivo da pasta "backups".`); }
  } else {
    if (!confirm(`Não encontrei "${DATA_FILE}" na pasta "${h.name}".\n\nCriar um novo arquivo de dados vazio nesta pasta?\n\n(Se você já usa o sistema em outro computador, cancele e confira se o OneDrive terminou de sincronizar.)`)) return false;
    fh = await h.getFileHandle(DATA_FILE, {create:true});
  }
  store.dir = h; store.file = fh; store.mode = 'pasta'; lsSet(LS_MODO, 'pasta');
  if (dados) {
    S = dados; store.lastText = txt;
    backupDiario(txt);
  } else {
    S = novoEstado();
    let local = null; try { local = localStorage.getItem(LS_LOCAL); } catch(e){}
    if (local && confirm('Encontrei dados que você usou antes só neste navegador. Deseja levá-los para o novo arquivo?')) { try { S = normalize(JSON.parse(local)); } catch(e){} }
    store.lastText = '';
    await salvarAgora();
  }
  await idbSet('pasta', h);
  entrar();
  return true;
}
async function verificarExterno(){
  if (!REMOTO() || store.saving || store.dirty) return;
  try {
    const txt = await lerDados();
    if (txt.trim() && txt !== store.lastText) {
      S = normalize(JSON.parse(txt)); store.lastText = txt; render();
      toast('Dados atualizados: o arquivo foi alterado em outro computador.');
    }
  } catch(e){}
}

function statusOpts(sel){ return Object.entries(STATUS).map(([k, s]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${s.nome}</option>`).join(''); }
function badgeStatus(st){ const s = STATUS[st] || STATUS.fila; return `<span class="badge"><span class="d" style="background:${s.cor}"></span>${s.nome}</span>`; }
function badgePag(p){
  const s = statusPag(p);
  if (s === 'pago') return `<span class="badge good">${ic('check')}Pago</span>`;

function prazoHTML(p){
  if (!p.prazo) return '<span class="muted">—</span>';
  if (p.status === 'entregue' || p.status === 'cancelado') return `<span class="muted">${fmtData(p.prazo)}</span>`;
  const d = diasAte(p.prazo);
  if (d < 0) return `<span class="badge crit">${ic('alert')}Atrasado</span><div class="t2">${fmtData(p.prazo)}</div>`;
  if (d === 0) return `<span class="badge warn">Hoje</span>`;

function filDots(p){ return (p.filamentos || []).map(it => { const f = getFil(it.filamentoId); return f ? `<span class="swatch sm" title="${esc(filNome(f))}" style="background:${corValida(f.corHex)}"></span>` : ''; }).join(''); }
function ordenarPedidos(a, b){
  const rank = p => ATIVOS.includes(p.status) ? 0 : p.status === 'orcamento' ? 1 : p.status === 'entregue' ? 2 : 3;
  const ra = rank(a), rb = rank(b);
  if (ra !== rb) return ra - rb;
  if (ra === 0) { const pa = a.prazo || '9999', pb = b.prazo || '9999'; if (pa !== pb) return pa < pb ? -1 : 1; }
  return num(b.numero) - num(a.numero);
}

/* ---------------- Financeiro ---------------- */
function periodo(p){
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();
  switch (p) {
    case 'mes': return [isoDe(new Date(y, m, 1)), isoDe(new Date(y, m + 1, 0))];
    case 'mesPassado': return [isoDe(new Date(y, m - 1, 1)), isoDe(new Date(y, m, 0))];
    case 'ano': return [y + '-01-01', y + '-12-31'];
    case '12m': return [isoDe(new Date(y, m - 11, 1)), isoDe(new Date(y, m + 1, 0))];
    default: return ['0000-01-01', '9999-12-31'];
  }
}
// "Tudo" também inclui lançamentos sem data (histórico importado da planilha)
const noPeriodo = (d, [a, b]) => a === '0000-01-01' || (!!d && d >= a && d <= b);
function serieMensal(n){
  const t = new Date(), out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(t.getFullYear(), t.getMonth() - i, 1);
    out.push({ k: d.getFullYear() + '-' + pad(d.getMonth() + 1), rotulo: MESES[d.getMonth()], longo: `${MESES_L[d.getMonth()]} de ${d.getFullYear()}`, receita:0, gasto:0 });
  }
  const idx = Object.fromEntries(out.map((o, i) => [o.k, i]));
  recebimentos().forEach(r => { const i = idx[(r.data || '').slice(0, 7)]; if (i != null) out[i].receita += num(r.valor); });
  S.gastos.forEach(g => { const i = idx[(g.data || '').slice(0, 7)]; if (i != null) out[i].gasto += num(g.valor); });
  return out;
}
function vFinanceiro(){
  const f = UI.fin, per = periodo(f.periodo);
  const recs = recebimentos().filter(r => noPeriodo(r.data, per)).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const gastos = S.gastos.filter(g => noPeriodo(g.data, per)).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const rec = soma(recs, r => r.valor), gas = soma(gastos, g => g.valor), res = rec - gas;
  const entregues = S.pedidos.filter(p => p.status === 'entregue' && noPeriodo(p.dataEntrega || p.dataPedido, per));
  const lucroPed = soma(entregues, p => num(p.preco) - num(p.custo));

  const aRec = soma(pedidosAReceber(), saldoDe);

      <div class="head-actions"><button class="btn primary" data-act="novoGasto">${ic('plus')} Novo gasto</button></div></div>

    <div class="kpis">

      ${kpi('Gastos', fmt(gas), `${gastos.length} lançamento${gastos.length === 1 ? '' : 's'}`)}
      ${kpi('Resultado', fmt(res), rec > 0 ? `margem de ${fmtN(res / rec * 100)}%` : 'recebido − gastos', res < 0 ? 'neg' : '')}
      ${kpi('Pedidos entregues', entregues.length, entregues.length ? `ticket médio ${fmt(ticket)} · lucro est. ${fmt(lucroPed)}` : 'no período')}
      ${kpi('A receber (hoje)', fmt(aRec), 'todos os pedidos em aberto')}
    </div>
    <div class="card mb">

        <details class="tbl"><summary>Ver tabela mês a mês</summary><div class="table-wrap"><table>
          <thead><tr><th>Mês</th><th class="num">Recebido</th><th class="num">Gastos</th><th class="num">Resultado</th></tr></thead>
          <tbody>${serie.slice().reverse().map(m => `<tr><td style="text-transform:capitalize">${m.longo}</td><td class="num">${fmt(m.receita)}</td><td class="num">${fmt(m.gasto)}</td><td class="num" style="${m.receita - m.gasto < 0 ? 'color:var(--crit-text)' : ''}">${fmt(m.receita - m.gasto)}</td></tr>`).join('')}</tbody>

      </div></div>

        ${tops.length ? `<div class="hbars">${tops.map(([id, v]) => `<div><div class="hbar-l"><span>${esc(nomeCli(id) || 'Sem cliente')}</span><span>${fmt(v)}</span></div><div class="hbar"><i style="width:${(v / maxCli * 100).toFixed(1)}%;background:var(--s1)"></i></div></div>`).join('')}</div>` : '<div class="empty">Sem recebimentos no período.</div>'}

        <div class="row-btns">
          <select class="in auto" data-chg="finCat" aria-label="Categoria"><option value="">Todas as categorias</option>${CAT_GASTOS.map(c => `<option ${c === f.cat ? 'selected' : ''}>${c}</option>`).join('')}</select>
          <button class="btn sm" data-act="exportGastos">${ic('download')} CSV</button>

/* =====================================================================
   GRÁFICO (SVG desenhado à mão)
   ===================================================================== */
function legendaHTML(){ return `<div class="legend"><span><i style="background:var(--s1)"></i>Recebido</span><span><i style="background:var(--s2)"></i>Gastos</span></div>`; }
function escala(max, n){
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nr = raw / mag;
  const step = (nr <= 1 ? 1 : nr <= 2 ? 2 : nr <= 2.5 ? 2.5 : nr <= 5 ? 5 : 10) * mag;
  return { step, top: step * Math.ceil(max / step) };
}
const fmtCurto = v => v >= 1000 ? 'R$ ' + fmtN(v / 1000, 1) + ' mil' : 'R$ ' + fmtN(v, 0);
function desenharGraficos(){
  $$('[data-chart]').forEach(el => { el.innerHTML = graficoBarras(serieMensal(+el.dataset.chart || 6), el.clientWidth || 600); });
}
function graficoBarras(dados, W){
  const H = 220, L = 62, R = 4, T = 10, B = 26, ih = H - T - B, iw = W - L - R, gw = iw / dados.length;
  const max = Math.max(...dados.flatMap(d => [d.receita, d.gasto]), 0);
  const { step, top } = max > 0 ? escala(max, 4) : { step: 25, top: 100 };
  const bw = Math.max(3, Math.min(26, (gw - 10) / 2 - 1));
  const y = v => T + ih - (v / top) * ih;
  const barra = (x, v, cls) => {
    if (v <= 0) return '';
    const h = Math.max(1.5, (v / top) * ih), yy = T + ih - h, r = Math.min(4, bw / 2, h);
    return `<path class="${cls}" d="M${x},${T + ih} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${T + ih} Z"/>`;
  };
  const cada = gw < 34 ? 2 : 1;
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="Gráfico de barras: recebido e gastos por mês">`;
  for (let k = 0; k * step <= top + 1e-9; k++) {
    const v = k * step, yy = y(v);
    if (k > 0) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/>`;
    s += `<text class="tick" x="${L - 8}" y="${yy + 4}" text-anchor="end">${fmtCurto(v)}</text>`;
  }
  dados.forEach((d, i) => {
    const x0 = L + gw * i, cx = x0 + gw / 2, res = d.receita - d.gasto;
    const tip = `<b style="text-transform:capitalize">${d.longo}</b><div class="tr"><span><i style="background:var(--s1)"></i>Recebido</span><span>${fmt(d.receita)}</span></div><div class="tr"><span><i style="background:var(--s2)"></i>Gastos</span><span>${fmt(d.gasto)}</span></div><div class="sep"></div><div class="tr"><span>Resultado</span><b style="margin:0">${fmt(res)}</b></div>`;
    s += `<rect class="hit" x="${x0}" y="${T}" width="${gw}" height="${ih}" rx="4" data-tip="${esc(tip)}"/>`;
    s += barra(cx - bw - 1, d.receita, 'b1') + barra(cx + 1, d.gasto, 'b2');
    if (i % cada === (dados.length - 1) % cada) s += `<text class="tick" x="${cx}" y="${H - 8}" text-anchor="middle">${d.rotulo}</text>`;
  });
  s += `<line class="base" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/></svg>`;
  return s;
}

// avisos abaixo das linhas de filamento: carretel sem preço, estoque insuficiente e quando o estoque é descontado
function avisosFilHTML(){
  const av = [];
  const usados = {};
  D.filamentos.forEach(it => { if (getFil(it.filamentoId)) usados[it.filamentoId] = (usados[it.filamentoId] || 0) + num(it.gramas); });
  Object.keys(usados).forEach(id => {
    const f = getFil(id);
    if (num(f.preco) <= 0 || num(f.pesoTotal) <= 0) av.push(['warn', `<b>${esc(filNome(f))}</b> está sem preço cadastrado, então o custo desse filamento sai R$ 0,00. Edite o carretel em Filamentos e informe quanto pagou.`]);
    const disponivel = num(f.pesoRestante) + (D.estoqueBaixado ? soma((S.pedidos.find(p => p.id === D.id) || {filamentos:[]}).filamentos.filter(it => it.filamentoId === id), it => it.gramas) : 0);
    if (usados[id] > disponivel) av.push(['warn', `<b>${esc(filNome(f))}</b>: o pedido usa ${fmtG(usados[id])}, mas só há ${fmtG(disponivel)} no carretel.`]);
  });
  const g = soma(Object.values(usados), v => v);
  if (DM === 'pedido' && g > 0) {
    if (!CONSOME.includes(D.status)) av.push(['info', `O estoque (${fmtG(g)}) será descontado quando o status for <b>Imprimindo</b>, <b>Pronto</b> ou <b>Entregue</b>.`]);

  }
  return av.map(([t, m]) => `<div class="aviso ${t}">${ic(t === 'warn' ? 'alert' : 'filamentos')}<span>${m}</span></div>`).join('');

   buscar(q) → itens; item(x) → {html}; escolher(x). "rotulo" é o texto mostrado quando fechado:
   se o campo ainda mostra o rótulo ao abrir, a lista aparece completa em vez de filtrada por ele. */
function criarCombo({inp, list, buscar, item, escolher, rotulo = () => '', vazio = 'Nada encontrado.'}){
  let itens = [], ativo = 0;
  const consulta = () => inp.value === rotulo() ? '' : inp.value;
  const desenhar = () => {
    itens = buscar(consulta()).slice(0, 60);
    ativo = Math.min(ativo, Math.max(0, itens.length - 1));
    list.innerHTML = itens.length ? itens.map((x, i) => `<div class="combo-it ${i === ativo ? 'on' : ''}" role="option" data-i="${i}" aria-selected="${i === ativo}">${item(x)}</div>`).join('') : `<div class="combo-vazio">${vazio}</div>`;
    list.hidden = false; inp.setAttribute('aria-expanded', 'true');
    const el = list.querySelector('.combo-it.on'); if (el) el.scrollIntoView({block:'nearest'});
  };
  const fechar = () => { list.hidden = true; inp.setAttribute('aria-expanded', 'false'); };
  const pegar = i => { const x = itens[i]; if (!x) return; fechar(); escolher(x); };
  const abrir = () => { if (list.hidden) { ativo = 0; desenhar(); setTimeout(() => inp.select()); } };
  inp.addEventListener('input', () => { ativo = 0; desenhar(); });
  inp.addEventListener('mousedown', () => { if (list.hidden) setTimeout(abrir); });
  // ao sair sem escolher, volta a mostrar o que está selecionado
  inp.addEventListener('blur', () => setTimeout(() => { fechar(); if (rotulo() && document.activeElement !== inp) inp.value = rotulo(); }, 150));
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) abrir(); else { ativo = Math.min(ativo + 1, itens.length - 1); desenhar(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ativo = Math.max(ativo - 1, 0); desenhar(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (!list.hidden && itens.length) pegar(ativo); }
    else if (e.key === 'Escape' && !list.hidden) { e.stopPropagation(); fechar(); if (rotulo()) inp.value = rotulo(); } // não fecha o pedido inteiro
  });
  list.addEventListener('mousedown', e => { const it = e.target.closest('.combo-it'); if (it) { e.preventDefault(); pegar(+it.dataset.i); } });
}

const GENERICO = {id:'', generico:true};
const rotuloFil = id => id ? (getFil(id) ? `${filNome(getFil(id))}${getFil(id).marca ? ' · ' + getFil(id).marca : ''}` : '(filamento removido)') : 'Filamento genérico';
function buscarFilamentos(q, sel){
  const termos = norm(q).split(/\s+/).filter(Boolean);
  const bate = t => termos.every(w => norm(t).includes(w));
  const arr = S.filamentos.filter(f => num(f.pesoRestante) > 0 || f.id === sel)
    .filter(f => bate(`${f.material} ${f.cor} ${f.marca || ''} ${f.fornecedor || ''}`))
    .sort((a, b) => (b.id === sel) - (a.id === sel) || String(a.material).localeCompare(b.material) || String(a.cor).localeCompare(b.cor));
  return bate('generico filamento generico sem estoque') ? [...arr, GENERICO] : arr;
}

/* ---------- pedido → catálogo ---------- */
const produtoPorNome = nome => nome ? S.produtos.find(x => norm(x.nome).trim() === norm(nome).trim()) : null;
// o pedido guarda totais; o catálogo guarda valores por unidade
function produtoDePedido(p, base){
  const q = Math.max(1, num(p.quantidade));
  return {
    id: base ? base.id : uid(), nome: p.titulo, descricao: base ? base.descricao : '',
    filamentos: p.filamentos.filter(it => num(it.gramas) > 0).map(it => ({filamentoId: it.filamentoId, gramas: r1(num(it.gramas) / q)})),
    minutos: Math.round(num(p.minutos) / q), minutosTrabalho: Math.round(num(p.minutosTrabalho) / q),
    extras: r2(num(p.extras) / q), pintado: !!p.pintado, preco: r2(num(p.preco) / q),
  };
}
function gravarNoCatalogo(p){
  const base = produtoPorNome(p.titulo);
  const x = produtoDePedido(p, base);
  if (base) Object.assign(base, x); else S.produtos.push(x);
  S.pedidos.forEach(o => { if (norm(o.titulo).trim() === norm(x.nome).trim() && !o.produtoId) o.produtoId = x.id; });
  agendarSalvar();
  return {x, atualizado: !!base};
}
function sugerirCatalogo(p){
  const n = norm(p.titulo).trim();
  if (produtoPorNome(p.titulo) || S.ignorarCatalogo.includes(n)) return;
  const vezes = S.pedidos.filter(o => norm(o.titulo).trim() === n && o.status !== 'cancelado').length;
  if (vezes < 2) return;
  toast(`“${p.titulo}” já foi pedido ${vezes} vezes. Adicionar ao catálogo?`, 'acao', [
    {label: 'Adicionar', fn: () => { const pedido = S.pedidos.find(o => o.id === p.id) || p; gravarNoCatalogo(pedido); render(); toast(`“${p.titulo}” adicionado ao catálogo.`); }},
    {label: 'Não perguntar', fn: () => { S.ignorarCatalogo.push(n); agendarSalvar(); }},
  ]);
}
function textoOrcamento(){
  const c = S.config;
  const mats = [...new Set(D.filamentos.map(it => getFil(it.filamentoId)).filter(Boolean).map(filNome))];
  const pago = soma(D.pagamentos, x => x.valor), preco = num(D.preco);
  const L = [`Olá${D.clienteNome ? ', ' + D.clienteNome.split(' ')[0] : ''}! Segue o orçamento:`, '', `*${D.titulo || 'Impressão 3D'}*`, `Quantidade: ${D.quantidade}`];
  if (mats.length) L.push(`Material: ${mats.join(', ')}`);
  if (D.prazo) L.push(`Entrega prevista: ${fmtData(D.prazo)}`);
  L.push(`*Valor: ${fmt(preco)}*`);
  if (pago > 0) L.push(`Já pago: ${fmt(pago)} · Restante: ${fmt(Math.max(0, preco - pago))}`);
  if (c.chavePix) L.push('', `Chave Pix: ${c.chavePix}`);
  L.push('', c.nomeNegocio || '');
  return L.join('\n').trim();
}

function baixar(nome, conteudo, tipo){
  const b = new Blob([conteudo], {type:tipo}), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csv(rows){
  return '﻿' + rows.map(r => r.map(v => {
    let s = typeof v === 'number' ? v.toFixed(2).replace('.', ',') : String(v ?? '');
    // um texto começando com = + - @ seria executado como fórmula pelo Excel
    if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
}

  fecharModal,
  tema: () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    try { localStorage.setItem(LS_TEMA, dark ? 'light' : 'dark'); } catch(e){}
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'; render();
  },
  cliqueStatus: () => { if (store.status === 'login') ACT.entrarMicrosoft(); else if (store.status === 'err') ACT.reconectar(); else if (store.mode === 'local') ACT.goto('config'); },
  reconectar: async () => {
    if (store.mode === 'onedrive') { store.dirty = true; await salvarAgora(); if (store.status === 'ok') toast('Dados salvos no OneDrive.'); return; }
    try { if (await store.dir.requestPermission({mode:'readwrite'}) === 'granted') { store.dirty = true; await salvarAgora(); } }
    catch(e) { toast('Não foi possível acessar a pasta: ' + e.message, 'erro'); }
  },
  entrarMicrosoft: () => {
    // se havia alteração não salva, guarda para aplicar depois do login
    if (store.mode === 'onedrive' && store.dirty) lsSet(LS_PEND, { base: store.lastText, dados: S });
    msLogin();
  },
  odComecarVazio: async () => {
    if (!confirm('Começar com o sistema vazio no OneDrive? (Se você já tem dados, use “Enviar meu dados.json”.)')) return;
    S = novoEstado(); store.dirty = true; entrar(); await salvarAgora();
  },
  sairMicrosoft: () => {
    if (store.dirty && !confirm('Há alterações ainda não salvas no OneDrive. Sair mesmo assim?')) return;
    // apaga deste aparelho o acesso e as cópias locais dos dados
    [LS_TOK, LS_MODO, LS_PEND, LS_SAFE, LS_LOCAL].forEach(k => lsSet(k, null));
    store.dirty = false;
    location.href = msRedirect();
  },
  salvarJa: async () => { await salvarAgora(); if (store.status === 'ok') toast('Dados salvos.'); },

  // tela inicial
  continuarPasta: async () => {
    const h = store.handle;
    try { if (await h.requestPermission({mode:'readwrite'}) !== 'granted') { toast('Permissão negada. Clique de novo e escolha “Permitir”.', 'erro'); return; } await conectarPasta(h); }
    catch(e) { telaInicial(e.message); }
  },
  escolherPasta: async () => {
    try { const h = await window.showDirectoryPicker({id:'gestor3d', mode:'readwrite'}); store.handle = h; await conectarPasta(h); }
    catch(e) { if (e.name !== 'AbortError') telaInicial('Não foi possível usar essa pasta: ' + e.message); }
  },
  trocarPasta: async () => {
    if (store.dirty) await salvarAgora();
    try { const h = await window.showDirectoryPicker({id:'gestor3d', mode:'readwrite'}); store.handle = h; await conectarPasta(h); toast(`Usando a pasta “${h.name}”.`); }
    catch(e) { if (e.name !== 'AbortError') toast('Não foi possível usar essa pasta: ' + e.message, 'erro'); }
  },
  modoLocal: () => {
    store.mode = 'local';
    try { const t = localStorage.getItem(LS_LOCAL); if (t) S = normalize(JSON.parse(t)); } catch(e){}
    entrar();
  },
  exportar: () => { baixar(`backup-gestor3d-${hojeISO()}.json`, JSON.stringify(S, null, 1), 'application/json'); },
  importar: () => { $('#fileImport').value = ''; $('#fileImport').click(); },

  // pedidos
  novoPedido: () => abrirPedido(null),
  editPedido: id => abrirPedido(id),
  pedSt: id => { UI.ped.st = id; render(); },
  receber: id => abrirReceber(id),
  confirmarReceber: () => {
    const p = S.pedidos.find(x => x.id === receberId); const E = $('#fR').elements;
    const v = r2(num(E.valor.value)); if (!p || v <= 0) { toast('Informe um valor.', 'erro'); return; }
    p.pagamentos.push({id:uid(), data:E.data.value || hojeISO(), valor:v, forma:E.forma.value});
    fecharModal(); agendarSalvar(); render();
    toast(saldoDe(p) > 0 ? `Pagamento registrado. Falta ${fmt(saldoDe(p))}.` : `Pedido #${p.numero} quitado.`);
  },
  salvarPedido,
  addFilRow: () => { lerForm(); D.filamentos.push({filamentoId: (D.filamentos[D.filamentos.length - 1] || {}).filamentoId || filPadrao(), gramas:0}); renderFils(); const q = $$('#dFils .fr-q'); if (q.length) { q[q.length - 1].focus(); q[q.length - 1].select(); } atualizarCalc(); },
  delFilRow: i => { lerForm(); D.filamentos.splice(+i, 1); renderFils(); atualizarCalc(); },
  addPagRow: () => { lerForm(); const falta = Math.max(0, r2(num(D.preco) - soma(D.pagamentos, x => x.valor))); D.pagamentos.push({id:uid(), data:hojeISO(), valor: falta || '', forma:'Pix'}); $('#dPags').innerHTML = pagRowsHTML(); atualizarCalc(); },
  delPagRow: i => { lerForm(); D.pagamentos.splice(+i, 1); $('#dPags').innerHTML = pagRowsHTML(); atualizarCalc(); },
  quitarDraft: () => {
    lerForm(); const falta = r2(num(D.preco) - soma(D.pagamentos, x => x.valor));
    if (num(D.preco) <= 0) { toast('Informe o preço cobrado primeiro.', 'erro'); return; }
    if (falta <= 0) { toast('Este pedido já está pago.'); return; }
    D.pagamentos.push({id:uid(), data:hojeISO(), valor:falta, forma:'Pix'}); $('#dPags').innerHTML = pagRowsHTML(); atualizarCalc();
  },
  salvarNoCatalogo: (_, el) => {
    lerForm();
    if (!D.titulo) { toast('Informe o que será impresso.', 'erro'); return; }
    if (num(D.preco) <= 0 && !confirm('Este pedido está sem preço cobrado. Salvar no catálogo mesmo assim?')) return;
    const base = produtoPorNome(D.titulo);
    if (base && !confirm(`“${base.nome}” já está no catálogo (${fmt(base.preco)}/un.).\n\nAtualizar com os valores deste pedido (${fmt(num(D.preco) / Math.max(1, num(D.quantidade)))}/un.)?`)) return;
    const {x, atualizado} = gravarNoCatalogo(D);
    D.produtoId = x.id;
    if (el) el.innerHTML = `${ic('catalogo')} Atualizar catálogo`;
    toast(`“${x.nome}” ${atualizado ? 'atualizado no' : 'adicionado ao'} catálogo (${fmt(x.preco)} por unidade).`);
  },
  usarSugerido: v => { const f = $('#fD'); f.elements.preco.value = num(v).toFixed(2); lerForm(); atualizarCalc(); },
  excluirPedido: () => {
    const p = S.pedidos.find(x => x.id === D.id); if (!p) return;
    if (!confirm(`Excluir o pedido #${p.numero} (${p.titulo})?${p.estoqueBaixado ? '\n\nO filamento já descontado NÃO volta para o estoque.' : ''}\nOs pagamentos dele também saem do financeiro.`)) return;
    S.pedidos = S.pedidos.filter(x => x.id !== p.id); fecharModal(); agendarSalvar(); render(); toast('Pedido excluído.');
  },
  duplicarPedido: () => { lerForm(); Object.assign(D, {id:null, numero:null, status:'fila', pagamentos:[], dataPedido:hojeISO(), prazo:'', dataEntrega:'', estoqueBaixado:false, criadoEm:null}); modalPedido(); toast('Cópia criada — ajuste e salve.'); },
  copiarOrc: () => { lerForm(); copiar(textoOrcamento()); },
  whatsOrc: () => {
    lerForm();
    const c = S.clientes.find(c => norm(c.nome) === norm(D.clienteNome));
    const link = c && linkWhats(c.telefone, textoOrcamento());
    if (!link) { copiar(textoOrcamento()); toast('Cliente sem telefone cadastrado — texto copiado para você colar.'); return; }
    window.open(link, '_blank', 'noopener');
  },
  exportPedidos: () => {
    const rows = [['Nº','Data','Cliente','Pedido','Qtd','Status','Prazo','Entregue em','Valor','Pago','Saldo','Custo estimado','Filamentos (g)','Tempo (min)']];
    S.pedidos.slice().sort((a, b) => num(a.numero) - num(b.numero)).forEach(p => rows.push([p.numero, fmtData(p.dataPedido), nomeCli(p.clienteId), p.titulo, p.quantidade, (STATUS[p.status] || {}).nome, fmtData(p.prazo), fmtData(p.dataEntrega), num(p.preco), pagoDe(p), saldoDe(p), num(p.custo), fmtN(soma(p.filamentos, it => it.gramas), 1), Math.round(num(p.minutos))]));
    baixar(`pedidos-${hojeISO()}.csv`, csv(rows), 'text/csv;charset=utf-8');
  },

  // clientes
  novoCliente: () => abrirCliente(null),
  editCliente: id => abrirCliente(id),
  salvarCliente: () => {
    const E = $('#fC').elements, nome = E.nome.value.trim();
    if (!nome) { toast('Informe o nome.', 'erro'); E.nome.focus(); return; }
    if (S.clientes.some(c => c.id !== clienteEdit && norm(c.nome) === norm(nome))) { toast('Já existe um cliente com esse nome.', 'erro'); return; }
    const dados = {nome, telefone:E.telefone.value.trim(), email:E.email.value.trim(), instagram:E.instagram.value.trim(), endereco:E.endereco.value.trim(), documento:E.documento.value.trim(), obs:E.obs.value};
    if (clienteEdit) Object.assign(getCli(clienteEdit), dados); else S.clientes.push({id:uid(), criadoEm:hojeISO(), ...dados});
    fecharModal(); agendarSalvar(); render(); toast('Cliente salvo.');
  },
  excluirCliente: () => {
    const c = getCli(clienteEdit); if (!c) return;
    if (S.pedidos.some(p => p.clienteId === c.id)) { toast('Este cliente tem pedidos — não é possível excluir.', 'erro'); return; }
    if (!confirm(`Excluir o cliente ${c.nome}?`)) return;
    S.clientes = S.clientes.filter(x => x.id !== c.id); fecharModal(); agendarSalvar(); render();
  },
  pedidoParaCliente: () => { const c = getCli(clienteEdit); abrirPedido(null, {clienteNome: c ? c.nome : ''}); },

  // filamentos
  novoFil: () => abrirFil(null),
  editFil: id => abrirFil(id),
  reporFil: id => { const f = getFil(id); if (!f) return; abrirFil(null, {marca:f.marca, material:f.material, cor:f.cor, corHex:f.corHex, pesoTotal:f.pesoTotal, pesoRestante:f.pesoTotal, preco:f.preco, fornecedor:f.fornecedor, estoqueMinimo:f.estoqueMinimo, obs:f.obs}); },
  salvarFil: () => {
    const E = $('#fF').elements;
    const dados = {material:E.material.value.trim() || 'PLA', marca:E.marca.value.trim(), cor:E.cor.value.trim(), corHex:E.corHex.value, pesoTotal:num(E.pesoTotal.value), pesoRestante:num(E.pesoRestante.value), preco:r2(num(E.preco.value)), fornecedor:E.fornecedor.value.trim(), dataCompra:E.dataCompra.value, estoqueMinimo:E.estoqueMinimo.value === '' ? '' : num(E.estoqueMinimo.value), obs:E.obs.value.trim()};
    if (!dados.cor) { toast('Informe a cor.', 'erro'); E.cor.focus(); return; }
    if (dados.pesoTotal <= 0) { toast('Informe o peso do carretel.', 'erro'); return; }
    if (filEdit) Object.assign(getFil(filEdit), dados);
    else {
      const f = {id:uid(), ...dados}; S.filamentos.push(f);
      if (E.lancarGasto && E.lancarGasto.checked && dados.preco > 0)
        S.gastos.push({id:uid(), data:dados.dataCompra || hojeISO(), categoria:'Filamento', descricao:`Filamento ${filNome(f)}${f.marca ? ' ' + f.marca : ''}`, valor:dados.preco, filamentoId:f.id});
    }
    fecharModal(); agendarSalvar(); render(); toast('Carretel salvo.');
  },
  excluirFil: () => {
    const f = getFil(filEdit); if (!f) return;
    const usos = S.pedidos.filter(p => p.filamentos.some(it => it.filamentoId === f.id)).length;
    if (!confirm(`Excluir o carretel ${filNome(f)}?${usos ? `\n\nEle aparece em ${usos} pedido(s); esses pedidos manterão o valor, mas o filamento aparecerá como “removido”. Dica: carretéis vazios podem simplesmente ficar com 0 g (ficam ocultos).` : ''}`)) return;
    S.filamentos = S.filamentos.filter(x => x.id !== f.id); fecharModal(); agendarSalvar(); render();
  },
  ajustarFil: id => abrirAjuste(id),
  salvarAjuste: () => {
    const f = getFil(filEdit), E = $('#fA').elements;
    const desc = num(E.descontar.value), bal = num(E.balanca.value), tara = num(E.tara.value);
    if (bal > 0) { f.pesoRestante = Math.max(0, r1(bal - tara)); f.tara = tara; toast(`Restante atualizado para ${fmtG(f.pesoRestante)}.`); }
    else if (desc > 0) { f.pesoRestante = r1(num(f.pesoRestante) - desc); toast(`−${fmtG(desc)} (${E.motivo.value}).`); }
    else { toast('Preencha “descontar” ou o peso da balança.', 'erro'); return; }
    fecharModal(); agendarSalvar(); render();
  },

  // catálogo
  novoProduto: () => abrirProduto(null),
  editProduto: id => abrirProduto(id),
  salvarProduto: () => {
    lerForm();
    if (!D.nome) { toast('Informe o nome do item.', 'erro'); return; }
    const x = {id:D.id || uid(), nome:D.nome, descricao:D.descricao, filamentos:D.filamentos.filter(it => num(it.gramas) > 0), minutos:D.minutos, minutosTrabalho:D.minutosTrabalho, extras:D.extras, pintado:!!D.pintado, preco:r2(num(D.preco))};
    const i = S.produtos.findIndex(p => p.id === x.id); if (i >= 0) S.produtos[i] = x; else S.produtos.push(x);
    fecharModal(); agendarSalvar(); render(); toast('Item salvo no catálogo.');
  },
  excluirProduto: () => { if (!confirm('Excluir este item do catálogo? (Pedidos já feitos não são afetados.)')) return; S.produtos = S.produtos.filter(p => p.id !== D.id); fecharModal(); agendarSalvar(); render(); },
  pedidoDeProduto: id => { const x = S.produtos.find(p => p.id === id); if (!x) return; DM = 'pedido'; D = novoDraftPedido(); aplicarProduto(x, 1); modalPedido(); },

  // financeiro
  finPer: id => { UI.fin.periodo = id; render(); },
  novoGasto: () => abrirGasto(null),
  editGasto: id => abrirGasto(id),
  salvarGasto: () => {
    const E = $('#fG').elements, v = r2(num(E.valor.value));
    if (v <= 0) { toast('Informe o valor.', 'erro'); E.valor.focus(); return; }
    const dados = {data:E.data.value || hojeISO(), categoria:E.categoria.value, descricao:E.descricao.value.trim(), valor:v};
    if (gastoEdit) Object.assign(S.gastos.find(g => g.id === gastoEdit), dados); else S.gastos.push({id:uid(), ...dados});
    fecharModal(); agendarSalvar(); render(); toast('Gasto salvo.');
  },
  excluirGasto: () => { if (!confirm('Excluir este gasto?')) return; S.gastos = S.gastos.filter(g => g.id !== gastoEdit); fecharModal(); agendarSalvar(); render(); },
  exportGastos: () => {
    const per = periodo(UI.fin.periodo);
    const rows = [['Data','Categoria','Descrição','Valor']];
    S.gastos.filter(g => noPeriodo(g.data, per)).sort((a, b) => (a.data || '').localeCompare(b.data || '')).forEach(g => rows.push([fmtData(g.data), g.categoria, g.descricao, num(g.valor)]));
    baixar(`gastos-${hojeISO()}.csv`, csv(rows), 'text/csv;charset=utf-8');
  },
  exportRecs: () => {
    const per = periodo(UI.fin.periodo);
    const rows = [['Data','Pedido','Cliente','Forma','Valor']];
    recebimentos().filter(r => noPeriodo(r.data, per)).sort((a, b) => (a.data || '').localeCompare(b.data || '')).forEach(r => rows.push([fmtData(r.data), `#${r.pedido.numero} ${r.pedido.titulo}`, nomeCli(r.pedido.clienteId), r.forma, num(r.valor)]));
    baixar(`recebimentos-${hojeISO()}.csv`, csv(rows), 'text/csv;charset=utf-8');
  },
};

const CHG = {
  statusPedido: el => {
    const p = S.pedidos.find(x => x.id === el.dataset.id); if (!p) return;
    const novo = {...p, status: el.value};
    commitPedido(novo); agendarSalvar(); render();
    if (novo.status === 'entregue' && saldoDe(novo) > 0) toast(`Entregue com ${fmt(saldoDe(novo))} a receber.`);
  },
  pedPag: el => { UI.ped.pag = el.value; $('#listaPed').innerHTML = listaPedidosHTML(); },
  filMat: el => { UI.fil.mat = el.value; render(); },
  filEsg: el => { UI.fil.esgotados = el.checked; render(); },
  finCat: el => { UI.fin.cat = el.value; render(); },
  cfg: el => {
    const k = el.dataset.id;
    S.config[k] = el.dataset.tipo === 'num' ? num(el.value) : el.value.trim();
    agendarSalvar();
    const p = $('#cfgPrev'); if (p) p.innerHTML = cfgPreview();
    if (k === 'nomeNegocio') $('#brandName').textContent = S.config.nomeNegocio || 'Chip Lab 3D';
  },
};
const INP = {
  pedQ: el => { UI.ped.q = el.value; $('#listaPed').innerHTML = listaPedidosHTML(); },
  cliQ: el => { UI.cli.q = el.value; $('#listaCli').innerHTML = listaClientesHTML(); },
  catQ: el => { UI.cat.q = el.value; $('#listaCat').innerHTML = listaCatalogoHTML(); },
  filQ: el => { UI.fil.q = el.value; const pos = el.selectionStart; render(); const n = $('[data-inp="filQ"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } },
};

/* ---------------- eventos globais ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'TR' || el.classList.contains('li')) { if (e.target.closest('select,input,a,button') && e.target.closest('select,input,a,button') !== el) return; }
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el.dataset.id, el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
document.addEventListener('submit', e => e.preventDefault()); // nenhum formulário recarrega a página ou envia dados para fora
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot').innerHTML) fecharModal();
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('#modalRoot .btn.primary')) $('#modalRoot .btn.primary').click();
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== UI.view) ACT.goto(v); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(desenharGraficos, 120); });
window.addEventListener('focus', verificarExterno);
document.addEventListener('visibilitychange', () => { if (!document.hidden) verificarExterno(); });
setInterval(() => { if (!document.hidden) verificarExterno(); }, 60000);
window.addEventListener('beforeunload', e => { if (store.dirty || store.saving) { e.preventDefault(); e.returnValue = ''; } });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ev => {
  let p = 'auto'; try { p = localStorage.getItem(LS_TEMA) || 'auto'; } catch(e){}
  if (p === 'auto') { document.documentElement.dataset.theme = ev.matches ? 'dark' : 'light'; render(); }
});

// tooltip do gráfico
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

// importar backup
$('#fileImport').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.pedidos)) throw new Error('arquivo não parece ser um backup deste sistema');
    if (!$('#app').hidden && !confirm('Importar este backup vai SUBSTITUIR todos os dados atuais. Continuar?')) return;
    S = normalize(d);
    if (!store.mode) store.mode = 'local';
    if (REMOTO()) store.lastText = await lerDados();
    agendarSalvar();
    if ($('#app').hidden) entrar(); else render();
    toast('Backup importado.');
  } catch(err) { toast('Não foi possível importar: ' + err.message, 'erro'); }
});

function toast(msg, tipo, acoes){
  const t = document.createElement('div'); t.className = 'toast ' + (tipo || '');
  const m = document.createElement('span'); m.textContent = msg; t.appendChild(m);
  if (acoes && acoes.length) {
    const b = document.createElement('div'); b.className = 'toast-acoes';
    acoes.forEach(a => { const bt = document.createElement('button'); bt.textContent = a.label; bt.addEventListener('click', () => { t.remove(); a.fn(); }); b.appendChild(bt); });
    const x = document.createElement('button'); x.textContent = 'Agora não'; x.addEventListener('click', () => t.remove()); b.appendChild(x);
    t.appendChild(b);
  }
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), acoes ? 15000 : tipo === 'erro' ? 5000 : 3200);
}

// Segurança: não funciona dentro de outro site (evita que uma página maliciosa "embrulhe" o sistema e induza cliques)
if (window.top !== window.self) {
  document.body.innerHTML = '<p style="font:16px system-ui;padding:24px">Abra o Chip Lab 3D diretamente pelo endereço dele.</p>';
} else {
  iniciar();
}
</script>
